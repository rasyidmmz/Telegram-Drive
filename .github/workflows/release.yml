name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate frontend
        working-directory: app
        run: npx tsc --noEmit --pretty false

      - name: Validate updater signing configuration
        working-directory: app
        run: npm run test:updater-signing-key

      - name: Validate Rust source
        working-directory: app/src-tauri
        run: cargo check --locked

      - name: Validate release version and changelog
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH. Received v$version"
          }

          $packageVersion = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoToml = Get-Content app/src-tauri/Cargo.toml -Raw
          $cargoLock = Get-Content app/src-tauri/Cargo.lock -Raw
          foreach ($actual in @($packageVersion, $tauriVersion)) {
            if ($actual -ne $version) { throw "Version mismatch: expected $version, found $actual" }
          }
          if ($cargoToml -notmatch "(?ms)^\[package\].*?^version\s*=\s*`"$([regex]::Escape($version))`"") {
            throw "app/src-tauri/Cargo.toml is not version $version"
          }
          if ($cargoLock -notmatch "(?ms)^name\s*=\s*`"telestash`"\s*^version\s*=\s*`"$([regex]::Escape($version))`"") {
            throw "app/src-tauri/Cargo.lock is not version $version"
          }

          $lines = Get-Content CHANGELOG.md
          $headerLine = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -eq "## [$version]") {
              $headerLine = $index
              break
            }
          }
          if ($headerLine -lt 0) { throw "CHANGELOG.md does not contain ## [$version]" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($index = $headerLine + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## \[') { break }
            $body.Add($lines[$index])
          }
          if (-not ($body -join "`n").Trim()) { throw "CHANGELOG.md entry for $version is empty" }

  build-tauri:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Setup MPV sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/bin | Out-Null
          curl.exe -fL -o mpv.zip "https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-x86_64-pc-windows-msvc.zip"
          7z e mpv.zip mpv.exe "-oapp/src-tauri/bin/"
          Move-Item -Force app/src-tauri/bin/mpv.exe app/src-tauri/bin/mpv-x86_64-pc-windows-msvc.exe
          Remove-Item mpv.zip

      - name: Setup Whisper resources
        working-directory: app
        run: node setup-whisper.js

      - name: Prepare updater signing key
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const path = require('path');
          const key = (process.env.KEY || '').trim();
          if (!key) throw new Error('TAURI_SIGNING_PRIVATE_KEY is required for a release.');
          const configPath = path.join('app', 'src-tauri', 'tauri.conf.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const b64 = key.startsWith('untrusted comment:')
            ? Buffer.from(key).toString('base64')
            : key.replace(/\r?\n/g, '');
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${b64}\n`);
          config.bundle ??= {};
          config.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2));

      - name: Verify updater signing key
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run verify:updater-signing-key

      - name: Build Windows installer
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Collect required release assets
        shell: pwsh
        run: |
          $bundleDir = 'app/src-tauri/target/release/bundle'
          $assets = Get-ChildItem -Path $bundleDir -Recurse -File | Where-Object {
            $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'latest.json'
          }
          if (-not ($assets | Where-Object Extension -eq '.exe')) { throw 'NSIS installer was not generated.' }
          if (-not ($assets | Where-Object Extension -eq '.zip')) { throw 'Updater archive was not generated.' }
          if (-not ($assets | Where-Object Name -eq 'latest.json')) { throw 'Updater manifest was not generated.' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          foreach ($asset in $assets) { Copy-Item $asset.FullName -Destination release-assets/$($asset.Name) -Force }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_VERSION;
            const version = tag.replace(/^v/, '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const start = changelog.findIndex((line) => line === `## [${version}]`);
            if (start < 0) throw new Error(`Missing CHANGELOG.md entry for ${version}.`);
            const end = changelog.findIndex((line, index) => index > start && line.startsWith('## ['));
            const body = changelog.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
            if (!body) throw new Error(`Empty CHANGELOG.md entry for ${version}.`);
            const assetDir = 'release-assets';
            const assets = fs.readdirSync(assetDir).filter((file) => file.endsWith('.exe') || file.endsWith('.zip') || file === 'latest.json');
            if (!assets.some((file) => file.endsWith('.exe')) || !assets.some((file) => file.endsWith('.zip')) || !assets.includes('latest.json')) {
              throw new Error('Required installer, updater archive, or latest.json is missing.');
            }

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag }));
              await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name: `TeleStash v${version}`, body, draft: true, prerelease: false });
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, name: `TeleStash v${version}`, body, draft: true, prerelease: false }));
            }

            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: release.id });
            for (const asset of existing.filter((asset) => assets.includes(asset.name))) {
              await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id });
            }
            for (const name of assets) {
              await github.rest.repos.uploadReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name, data: fs.readFileSync(path.join(assetDir, name)) });
            }
            await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, draft: false, prerelease: false });
